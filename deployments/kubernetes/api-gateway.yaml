apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmforge-api-gateway
  namespace: llmforge
  labels:
    app: llmforge-api-gateway
    component: api-gateway
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: llmforge-platform
spec:
  replicas: 3  # Multiple instances for load balancing
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2
  selector:
    matchLabels:
      app: llmforge-api-gateway
  template:
    metadata:
      labels:
        app: llmforge-api-gateway
        component: api-gateway
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: llmforge-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: api-gateway
        image: llmforge/api-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: SERVICE_HOST
          value: "0.0.0.0"
        - name: SERVICE_PORT
          value: "8000"
        - name: ORCHESTRATOR_URL
          valueFrom:
            configMapKeyRef:
              name: llmforge-config
              key: ORCHESTRATOR_URL
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: llmforge-config
              key: LOG_LEVEL
        - name: RATE_LIMIT_REQUESTS_PER_MINUTE
          valueFrom:
            configMapKeyRef:
              name: api-gateway-config
              key: RATE_LIMIT_REQUESTS_PER_MINUTE
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: api-gateway-config
              key: CORS_ORIGINS
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - llmforge-api-gateway
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: llmforge-api-gateway
  namespace: llmforge
  labels:
    app: llmforge-api-gateway
    component: api-gateway
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: llmforge-api-gateway

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llmforge-api-gateway-hpa
  namespace: llmforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llmforge-api-gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llmforge-api-gateway-pdb
  namespace: llmforge
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: llmforge-api-gateway

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: llmforge
data:
  RATE_LIMIT_REQUESTS_PER_MINUTE: "1000"
  CORS_ORIGINS: "*"
  REQUEST_TIMEOUT_SECONDS: "30"
  MAX_REQUEST_SIZE_MB: "10"

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llmforge-api-gateway-ingress
  namespace: llmforge
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - api.llmforge.local
    secretName: llmforge-api-tls
  rules:
  - host: api.llmforge.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: llmforge-api-gateway
            port:
              number: 80