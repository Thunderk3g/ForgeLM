apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmforge-training
  namespace: llmforge
  labels:
    app: llmforge-training
    component: training-service
    app.kubernetes.io/name: training-service
    app.kubernetes.io/part-of: llmforge-platform
spec:
  replicas: 1  # Training jobs are typically single-instance
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: llmforge-training
  template:
    metadata:
      labels:
        app: llmforge-training
        component: training-service
        app.kubernetes.io/name: training-service
        app.kubernetes.io/part-of: llmforge-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      nodeSelector:
        nvidia.com/gpu: "true"  # Ensure deployment on GPU nodes
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      containers:
      - name: training-service
        image: llmforge/training-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
          name: http
        env:
        - name: SERVICE_HOST
          value: "0.0.0.0"
        - name: SERVICE_PORT
          value: "8001"
        - name: ORCHESTRATOR_URL
          valueFrom:
            configMapKeyRef:
              name: llmforge-config
              key: ORCHESTRATOR_URL
        - name: CUDA_VISIBLE_DEVICES
          valueFrom:
            configMapKeyRef:
              name: llmforge-config
              key: CUDA_VISIBLE_DEVICES
        - name: TOKENIZERS_PARALLELISM
          valueFrom:
            configMapKeyRef:
              name: llmforge-config
              key: TOKENIZERS_PARALLELISM
        - name: CUDA_LAUNCH_BLOCKING
          valueFrom:
            configMapKeyRef:
              name: llmforge-config
              key: CUDA_LAUNCH_BLOCKING
        # The Hugging Face libraries read HF_TOKEN; nothing reads HUGGINGFACE_TOKEN.
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: llmforge-secrets
              key: huggingface-token
        - name: CONTAINER_MEMORY_LIMIT_GB
          valueFrom:
            resourceFieldRef:
              containerName: training-service
              resource: limits.memory
              divisor: "1Gi"
        resources:
          requests:
            cpu: "4"
            memory: "12Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "16"
            memory: "32Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: training-data
          mountPath: /app/data
        - name: training-models
          mountPath: /app/models
        - name: training-logs
          mountPath: /app/logs
        - name: model-cache
          mountPath: /home/llmforge/.cache
        - name: shm
          mountPath: /dev/shm
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10
      volumes:
      - name: training-data
        persistentVolumeClaim:
          claimName: training-data-pvc
      - name: training-models
        persistentVolumeClaim:
          claimName: training-models-pvc
      - name: training-logs
        persistentVolumeClaim:
          claimName: training-logs-pvc
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache-pvc
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - llmforge-training
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: llmforge-training
  namespace: llmforge
  labels:
    app: llmforge-training
    component: training-service
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: http
  selector:
    app: llmforge-training

---
