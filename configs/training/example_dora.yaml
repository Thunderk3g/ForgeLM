config_name: "example_dora"
description: "Example DoRA (Weight-Decomposed Low-Rank Adaptation) configuration"
version: "1.0"
created_at: "2025-01-09T12:00:00"
author: "LLMForge"

model:
  model_name: "Qwen2.5-3B"
  model_path: "models/base/Qwen_Qwen2.5-3B"
  quantization: "4bit"
  trust_remote_code: false
  use_fast_tokenizer: true
  model_revision: "main"

dataset:
  path: "data/prepared"
  format: "sharegpt"
  template: "qwen"
  system_message: "You are a helpful assistant specialized in following instructions precisely."
  max_samples: null
  test_size: 0.1

training:
  output_dir: "models/fine_tuned_dora"
  num_train_epochs: 2
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-04
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  lr_scheduler_type: "linear"
  warmup_ratio: 0.05
  warmup_steps: 0
  logging_steps: 5
  save_steps: 200
  eval_steps: 200
  save_total_limit: 3
  evaluation_strategy: "steps"
  fp16: false
  bf16: true
  dataloader_num_workers: 2
  remove_unused_columns: false
  report_to: []
  max_seq_length: 1024

peft:
  method: "dora"
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  bias: "none"
  use_dora: true
  oft_block_size: 4
  oft_dropout: 0.0
  pissa_init_method: "svd"
  pissa_iter: 16
  adalora_target_r: 8
  adalora_init_r: 12
  adalora_tinit: 0
  adalora_tfinal: 1000
  adalora_deltaT: 10
  adalora_beta1: 0.85
  adalora_beta2: 0.85
  adalora_orth_reg_weight: 0.5

environment:
  CUDA_VISIBLE_DEVICES: "0"
  WANDB_DISABLED: "true"