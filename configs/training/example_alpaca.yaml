config_name: "example_alpaca"
description: "Example Alpaca-style instruction tuning configuration"
version: "1.0"
created_at: "2025-01-09T12:00:00"
author: "LLMForge"

model:
  model_name: "Qwen2.5-3B"
  model_path: "models/base/Qwen_Qwen2.5-3B"
  quantization: null
  trust_remote_code: false
  use_fast_tokenizer: true
  model_revision: "main"

dataset:
  path: "data/prepared"
  format: "alpaca"
  template: "alpaca"
  system_message: null
  max_samples: null
  test_size: 0.1

training:
  output_dir: "models/fine_tuned"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-05
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  warmup_steps: 0
  logging_steps: 10
  save_steps: 500
  eval_steps: 500
  save_total_limit: 2
  evaluation_strategy: "steps"
  fp16: false
  bf16: false
  dataloader_num_workers: 4
  remove_unused_columns: false
  report_to: []
  max_seq_length: 512

peft:
  method: "qlora"
  rank: 16
  alpha: 32
  dropout: 0.1
  target_modules: null
  bias: "none"
  use_dora: false
  oft_block_size: 4
  oft_dropout: 0.0
  pissa_init_method: "svd"
  pissa_iter: 16
  adalora_target_r: 8
  adalora_init_r: 12
  adalora_tinit: 0
  adalora_tfinal: 1000
  adalora_deltaT: 10
  adalora_beta1: 0.85
  adalora_beta2: 0.85
  adalora_orth_reg_weight: 0.5

environment: {}