# Docker Compose for building shared base images
# Run: docker-compose -f docker-compose.base.yml build

services:
  # Shared ML Base Image - Contains CUDA, PyTorch, Transformers, Unsloth
  llmforge-ml-base:
    build:
      context: .
      dockerfile: docker/shared-ml-base/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: llmforge-ml-base:latest
    profiles:
      - base