services:

  # Service Orchestrator - Self-contained multi-stage build
  orchestrator:
    build:
      context: .
      dockerfile: docker/orchestrator/Dockerfile
    container_name: llmforge-orchestrator
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PROMETHEUS_ENABLED=true
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - llmforge-network

  # API Gateway - Self-contained multi-stage build
  api-gateway:
    build:
      context: .
      dockerfile: docker/api_gateway/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: llmforge-api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=8000
      - ORCHESTRATOR_URL=http://orchestrator:8080
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - RATE_LIMIT_REQUESTS_PER_MINUTE=1000
      - CORS_ORIGINS=*
    volumes:
      - ./logs:/app/logs
    depends_on:
      - orchestrator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - llmforge-network

  # Training Service - Optimized GPU build with dependency layering
  training-service:
    build:
      context: .
      dockerfile: docker/training_service/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: llmforge-training
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=8001
      - ORCHESTRATOR_URL=http://orchestrator:8080
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - TOKENIZERS_PARALLELISM=false
      - CUDA_LAUNCH_BLOCKING=0
      - MAX_TRAINING_JOBS=2
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./datasets:/app/datasets
      - ./logs:/app/logs
      - model_cache:/home/llmforge/.cache
    depends_on:
      - orchestrator
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - llmforge-network

  # Chat Comparison Service - Fast ML inference using shared patterns
  chat-comparison-service:
    build:
      context: .
      dockerfile: docker/chat_comparison_service/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: llmforge-chat-comparison
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=8002
      - ORCHESTRATOR_URL=http://orchestrator:8080
      - MAX_CACHED_PAIRS=${MAX_CACHED_PAIRS:-10}
      - MAX_HBM_GB=${MAX_HBM_GB:-12}
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - model_cache:/home/llmforge/.cache
    depends_on:
      - orchestrator
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - llmforge-network

  # Data Generation Service - Self-contained multi-stage build
  data-generation-service:
    build:
      context: .
      dockerfile: docker/data_generation_service/Dockerfile
    container_name: llmforge-data-generation
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=8003
      - ORCHESTRATOR_URL=http://orchestrator:8080
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./datasets:/app/datasets
      - ./logs:/app/logs
    depends_on:
      - orchestrator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - llmforge-network

  # Visualization Service - Self-contained multi-stage build
  visualization-service:
    build:
      context: .
      dockerfile: docker/visualization_service/Dockerfile
    container_name: llmforge-visualization
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=8004
      - ORCHESTRATOR_URL=http://orchestrator:8080
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - orchestrator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - llmforge-network

  # Model Management Service - Optimized GPU inference build
  model-management-service:
    build:
      context: .
      dockerfile: docker/model_management_service/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: llmforge-model-management
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=8005
      - ORCHESTRATOR_URL=http://orchestrator:8080
      - MAX_CACHED_MODELS=${MAX_CACHED_MODELS:-5}
      - CACHE_SIZE_GB=${CACHE_SIZE_GB:-20}
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - model_cache:/home/llmforge/.cache
    depends_on:
      - orchestrator
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - llmforge-network

volumes:
  model_cache:
    driver: local

networks:
  llmforge-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16