services:
  # Shared Base - Common dependencies for all microservices
  base:
    build:
      context: .
      dockerfile: src/docker/shared-base/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: llmforge-base:latest
    container_name: llmforge-base
    command: ["echo", "Base image built successfully"]
    networks:
      - llmforge-network

  # Shared ML Base - CUDA, PyTorch, Transformers for ML services
  ml-base:
    build:
      context: .
      dockerfile: src/docker/shared-ml-base/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: llmforge-ml-base:latest
    container_name: llmforge-ml-base
    command: ["echo", "ML Base image built successfully"]
    depends_on:
      - base
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    networks:
      - llmforge-network

  # Service Orchestrator - Self-contained multi-stage build
  orchestrator:
    build:
      context: .
      dockerfile: src/docker/services/orchestrator.dockerfile
    container_name: llmforge-orchestrator
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PROMETHEUS_ENABLED=true
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - base
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - llmforge-network

  redis:
    image: redis:7-alpine
    container_name: llmforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - llmforge-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # API Gateway - Lightweight self-contained service
  api-gateway:
    build:
      context: .
      dockerfile: src/docker/services/api_gateway.dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: llmforge-api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=8000
      - SERVICE_ADVERTISED_HOST=llmforge-api-gateway
      - ORCHESTRATOR_URL=http://orchestrator:8080
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - RATE_LIMIT_REQUESTS_PER_MINUTE=1000
      - CORS_ORIGINS=*
    volumes:
      - ./logs:/app/logs
    depends_on:
      - base
      - orchestrator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - llmforge-network

  # Training Service - ML optimized self-contained service with Windows GPU sharing
  training-service:
    build:
      context: .
      dockerfile: src/docker/services/training_service.dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: llmforge-training
    restart: unless-stopped
    init: true # Handle PID 1 properly
    ports:
      - "8001:8001"
    environment:
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=8001
      - SERVICE_ADVERTISED_HOST=llmforge-training
      - ORCHESTRATOR_URL=http://orchestrator:8080
      # Windows GPU Configuration (Direct GPU access)
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Unsloth Optimizations for RTX 3050 4GB
      - TOKENIZERS_PARALLELISM=false
      - CUDA_LAUNCH_BLOCKING=0
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:256,expandable_segments:True,backend:cudaMallocAsync
      # CRITICAL: Disable PyTorch Inductor to prevent compilation hangs
      - TORCH_COMPILE_DISABLE=1
      - TORCHINDUCTOR_MAX_AUTOTUNE=0
      - TORCHINDUCTOR_COMPILE_THREADS=1
      - TORCH_CUDA_ARCH_LIST="6.0;6.1;7.0;7.5;8.0;8.6;8.9;9.0"
      - MAX_TRAINING_JOBS=1
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
      # Container stability environment variables - RTX 3050 4GB Laptop with 32GB RAM
      - CONTAINER_MEMORY_LIMIT_GB=16
      - WORKER_MEMORY_GB=12
      - TRITON_CACHE_DIR=/tmp/.triton_cache
      - OMP_NUM_THREADS=4
      # GPU Orchestration for laptop GPU
      - GPU_ORCHESTRATION_ENABLED=true
      - GPU_SHARING_MODE=native
      - GPU_MEMORY_LIMIT_MB=3072  # 75% of 4GB GPU for training
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./datasets:/app/datasets
      - ./logs:/app/logs
      - model_cache:/home/llmforge/.cache
    depends_on:
      - ml-base
      - orchestrator
      - redis
    deploy:
      resources:
        limits:
          memory: 16G # RTX 3050 4GB Laptop with 32GB RAM - optimized for better performance
        reservations:
          memory: 12G # CRITICAL: Must reserve enough for model loading + Triton compilation
          devices:
            - driver: nvidia
              count: 1 # Shared GPU access
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 30s  # Increased: GPU busy during training
      retries: 5     # Increased: Allow more failures during training
      start_period: 60s
    networks:
      - llmforge-network

  # Chat Comparison Service - Fast ML inference using Windows GPU sharing
  chat-comparison-service:
    build:
      context: .
      dockerfile: src/docker/services/chat_comparison_service.dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: llmforge-chat-comparison
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=8002
      - SERVICE_ADVERTISED_HOST=llmforge-chat-comparison
      - ORCHESTRATOR_URL=http://orchestrator:8080
      # Windows GPU Configuration (Shared GPU access)
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Unsloth Inference Optimizations for RTX 3050 4GB
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:128,expandable_segments:True
      - TOKENIZERS_PARALLELISM=false
      - CUDA_LAUNCH_BLOCKING=0
      - MAX_CACHED_PAIRS=${MAX_CACHED_PAIRS:-4}
      - MAX_HBM_GB=${MAX_HBM_GB:-1}  # Reduced for 4GB GPU
      # GPU Orchestration for RTX 3050 4GB
      - GPU_ORCHESTRATION_ENABLED=true
      - GPU_SHARING_MODE=native
      - GPU_MEMORY_LIMIT_MB=512  # ~12.5% of 4GB GPU for chat comparison
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - model_cache:/home/llmforge/.cache
    depends_on:
      - ml-base
      - orchestrator
      - redis
    deploy:
      resources:
        limits:
          memory: 4G # Optimized for inference workloads
        reservations:
          memory: 3G
          devices:
            - driver: nvidia
              count: 1 # Shared GPU access
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - llmforge-network

  # Data Generation Service - Self-contained multi-stage build
  data-generation-service:
    build:
      context: .
      dockerfile: src/docker/services/data_generation_service.dockerfile
    container_name: llmforge-data-generation
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=8003
      - SERVICE_ADVERTISED_HOST=llmforge-data-generation
      - ORCHESTRATOR_URL=http://orchestrator:8080
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./datasets:/app/datasets
      - ./logs:/app/logs
    depends_on:
      - base
      - orchestrator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - llmforge-network

  # Factory Service - CPU only: planning, LLM-free classifiers, BFSI screening
  factory-service:
    build:
      context: .
      dockerfile: src/docker/services/factory_service.dockerfile
    container_name: llmforge-factory
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=8006
      - FACTORY_MODELS_DIR=/app/models/factory
      - HF_HOME=/app/models/hf_cache
    volumes:
      - ./models/factory:/app/models/factory
      - ./models/hf_cache:/app/models/hf_cache
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - llmforge-network

  # Visualization Service - Self-contained multi-stage build
  visualization-service:
    build:
      context: .
      dockerfile: src/docker/services/visualization_service.dockerfile
    container_name: llmforge-visualization
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=8004
      - SERVICE_ADVERTISED_HOST=llmforge-visualization
      - ORCHESTRATOR_URL=http://orchestrator:8080
      - MPLCONFIGDIR=/home/llmforge/.config/matplotlib
      - MATPLOTLIB_CACHE_DIR=/home/llmforge/.cache/matplotlib
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - matplotlib_cache:/home/llmforge/.cache
    depends_on:
      - base
      - orchestrator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - llmforge-network

  # Model Management Service - Optimized GPU inference build with Windows sharing
  model-management-service:
    build:
      context: .
      dockerfile: src/docker/services/model_management_service.dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: llmforge-model-management
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=8005
      - SERVICE_ADVERTISED_HOST=llmforge-model-management
      - ORCHESTRATOR_URL=http://orchestrator:8080
      # Windows GPU Configuration (Shared GPU access)
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Unsloth Model Management Optimizations for RTX 3050 4GB
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:128,expandable_segments:True
      - TOKENIZERS_PARALLELISM=false
      - CUDA_LAUNCH_BLOCKING=0
      - MAX_CACHED_MODELS=${MAX_CACHED_MODELS:-1}
      - CACHE_SIZE_GB=${CACHE_SIZE_GB:-2}  # Reduced for 4GB GPU
      # GPU Orchestration for RTX 3050 4GB
      - GPU_ORCHESTRATION_ENABLED=true
      - GPU_SHARING_MODE=native
      - GPU_MEMORY_LIMIT_MB=512  # ~12.5% of 4GB GPU for model management
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - model_cache:/home/llmforge/.cache
    depends_on:
      - ml-base
      - orchestrator
      - redis
    deploy:
      resources:
        limits:
          memory: 6G # Optimized for model management workloads
        reservations:
          memory: 4G
          devices:
            - driver: nvidia
              count: 1 # Shared GPU access
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - llmforge-network

volumes:
  model_cache:
    driver: local
  matplotlib_cache:
    driver: local

  redis_data:
    driver: local
 
networks:
  llmforge-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
