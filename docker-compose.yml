version: '3.8'

services:
  llmforge:
    build: .
    container_name: llmforge-finetuning
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./:/app               # ✅ mount entire project for live code updates
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    environment:
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
      - BASE_MODEL_DIR=${BASE_MODEL_DIR:-/app/models/base}
      - DATASET_DIR=${DATASET_DIR:-/app/data/prepared}
      - OUTPUT_DIR=${OUTPUT_DIR:-/app/models/finetuned}
      - CUDA_VISIBLE_DEVICES=0
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: "24"
          memory: 32G
        reservations:
          cpus: "16"
          memory: 16G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: 16g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - llmforge-network

  redis:
    image: redis:7-alpine
    container_name: llmforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped
    networks:
      - llmforge-network

  nginx:
    image: nginx:alpine
    container_name: llmforge-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - llmforge
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped
    networks:
      - llmforge-network

volumes:
  redis_data:
    driver: local

networks:
  llmforge-network:
    driver: bridge
